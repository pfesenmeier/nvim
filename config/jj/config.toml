#:schema https://docs.jj-vcs.dev/latest/config-schema.json

[ui]
editor = "nvim"
diff-editor = ":builtin"
diff-formatter = "difft"
default-command = "log"

# difft without --width so it reads DFT_WIDTH, which jjui sets to its preview pane size
[merge-tools.difft-pane]
program = "difft"
diff-args = ["--color=always", "$left", "$right"]

[user]
name = "Paul Fesenmeier"
email = "pbfesenmeier@sep.com"

# "bright black" is nearly invisible on the jjui selected row
[colors]
rest = "#829181"

[revsets]
bookmark-advance-to = "@-"

