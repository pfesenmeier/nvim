# jjui custom actions + key bindings.
# Lua-scripting docs: https://idursun.github.io/jjui/customization/lua-scripting/

[ui]
# everforest-light-hard, adapted from https://github.com/vic/tinted-jjui
# Theme file lives at themes/everforest-light.toml in this repo (symlinked).
theme = "everforest-light"

[preview]
# Use the pane-sized difft tool from the jj config
revision_command = ["show", "--color", "always", "--tool", "difft-pane", "-r", "$change_id"]
file_command = ["diff", "--color", "always", "--tool", "difft-pane", "-r", "$change_id", "$file"]

[[actions]]
name = "nv_edit_file"
lua = "EditFile()"

[[bindings]]
action = "nv_edit_file"
key = "e"
scope = "revisions.details"
desc = "Open file under cursor in nvim"

[[actions]]
name = "copy_focused_file"
lua = "CopyFocusedFile()"

[[bindings]]
action = "copy_focused_file"
key = "y"
scope = "revisions.details"
desc = "Copy focused file path to clipboard"

[[actions]]
name = "copy_checked_files"
lua = "CopyCheckedFiles()"

[[bindings]]
action = "copy_checked_files"
key = "Y"
scope = "revisions.details"
desc = "Copy checked file paths to clipboard"
