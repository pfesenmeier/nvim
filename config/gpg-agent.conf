enable-ssh-support
# gpg keys: 1h idle, 2h absolute. Was 400 days, which let anything holding the
# agent socket sign and decrypt silently - no prompt, no trace.
default-cache-ttl 3600
max-cache-ttl 7200
# ssh key: passphrase every time
default-cache-ttl-ssh 1
max-cache-ttl-ssh 1
pinentry-program /usr/bin/pinentry-gnome3
